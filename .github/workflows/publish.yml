name: Publish to GitHub Packages

on:
  push:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          server-id: github # To musi pasować do <id> w pom.xml
          settings-path: ${{ github.workspace }}

      - name: Deploy to GitHub Packages
        # Dodajemy zmienną środowiskową GITHUB_TOKEN
        run: mvn --batch-mode deploy -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}